services:
  skyblock-flips:
    image: node:lts
    container_name: skyblock-flips
    user: "1000:1000"
    working_dir: /app
    volumes:
      - ./:/app
    command: node server/http-server.js
    ports:
      - "8000:8000"
    environment:
      TZ: America/Denver
    restart: unless-stopped

  optimizer:
    image: python:3.12-slim
    container_name: optimizer
    user: "1000:1000"
    working_dir: /app
    volumes:
      - ./:/app
    depends_on:
      - skyblock-flips
    command: sh -c "pip install --user -q -r optimizer/requirements.txt && python optimizer/main.py"
    environment:
      TZ: America/Denver
      HOME: /tmp              # lets pip install packages as your user
      PYTHONUNBUFFERED: "1"   # makes print() show up in the logs right away
      API_BASE_URL: http://skyblock-flips:8000
    restart: unless-stopped

  labeled-logger:
    image: python:3.12-slim
    container_name: labeled-logger
    user: "1000:1000"
    working_dir: /app
    volumes:
      - ./:/app
    depends_on:
      - skyblock-flips
    command: sh -c "pip install --user -q -r optimizer/requirements.txt && python optimizer/labeled_data_logger.py"
    environment:
      TZ: America/Denver
      HOME: /tmp
      PYTHONUNBUFFERED: "1"
      API_BASE_URL: http://skyblock-flips:8000
    restart: unless-stopped
